/* ─── Reset & Base ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f1117;
  --bg2:      #181c27;
  --bg3:      #222738;
  --border:   #2d3348;
  --text:     #e8eaf0;
  --muted:    #7b82a0;
  --accent:   #4f8ef7;
  --green:    #34c98a;
  --red:      #f05a5a;
  --amber:    #f5a623;
  --radius:   8px;
  --font:     'DM Sans', system-ui, sans-serif;
  --mono:     'JetBrains Mono', 'Fira Code', monospace;
}

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

html { font-size: 14px; }
body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.5; min-height: 100vh; }

/* ─── Header & Nav ─────────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 24px;
  height: 52px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo { font-size: 15px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; }
.logo span { color: var(--accent); }

#nav { display: flex; gap: 2px; overflow-x: auto; }
#nav button {
  background: none; border: none; color: var(--muted);
  padding: 6px 13px; border-radius: var(--radius); cursor: pointer;
  font-size: 12px; font-family: var(--font); white-space: nowrap;
  transition: color .15s, background .15s;
}
#nav button:hover { color: var(--text); background: var(--bg3); }
#nav button.on { color: var(--accent); background: rgba(79,142,247,.12); font-weight: 500; }

/* ─── Layout ───────────────────────────────────── */
main { padding: 20px 24px; max-width: 1300px; margin: 0 auto; }
.tab { display: none; }
.tab.on { display: block; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

/* ─── Cards ────────────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 14px;
}
.card h3 {
  font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: .07em; color: var(--muted); margin-bottom: 12px;
}

/* ─── Metrics ──────────────────────────────────── */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.metric { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.metric .lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.metric .val { font-size: 22px; font-weight: 500; letter-spacing: -.5px; }

/* ─── Colors ───────────────────────────────────── */
.pos { color: var(--green); }
.neg { color: var(--red); }
.warn { color: var(--amber); }
.muted { color: var(--muted); }

/* ─── Progress Bars ────────────────────────────── */
.bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.fill { height: 100%; border-radius: 2px; transition: width .4s ease; }
.fill-ok   { background: var(--green); }
.fill-warn { background: var(--amber); }
.fill-over { background: var(--red); }
.fill-blue { background: var(--accent); }

/* ─── Rows ─────────────────────────────────────── */
.row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.row:last-child { border-bottom: none; }

/* ─── Form elements ────────────────────────────── */
select, input[type=text], input[type=number], input[type=date] {
  width: 100%; padding: 7px 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-size: 12px; font-family: var(--font);
  transition: border-color .15s;
}
select:focus, input:focus { outline: none; border-color: var(--accent); }
textarea {
  width: 100%; min-height: 90px; padding: 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-size: 12px; font-family: var(--mono);
  resize: vertical;
}
textarea:focus { outline: none; border-color: var(--accent); }
label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }

.fr  { display: grid; gap: 10px; margin-bottom: 10px; }
.fr2 { grid-template-columns: 1fr 1fr; }
.fr3 { grid-template-columns: 1fr 1fr 1fr; }
.fr4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

/* ─── Buttons ──────────────────────────────────── */
.btn {
  padding: 7px 15px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--bg3);
  color: var(--text); font-size: 12px; font-family: var(--font);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.btn-primary:hover { background: #3a78e6; border-color: #3a78e6; color: #fff; }
.btn-danger  { color: var(--red); border-color: transparent; }
.btn-danger:hover { background: rgba(240,90,90,.1); border-color: var(--red); }
.btn-sm { padding: 3px 9px; font-size: 11px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ─── Alerts ───────────────────────────────────── */
.alert { padding: 9px 13px; border-radius: var(--radius); font-size: 12px; margin: 8px 0; }
.alert-ok   { background: rgba(52,201,138,.1); border: 1px solid rgba(52,201,138,.3); color: var(--green); }
.alert-err  { background: rgba(240,90,90,.1);  border: 1px solid rgba(240,90,90,.3);  color: var(--red); }
.alert-info { background: rgba(79,142,247,.1); border: 1px solid rgba(79,142,247,.3); color: var(--accent); }
.alert-warn { background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.3); color: var(--amber); }

/* ─── Tables ───────────────────────────────────── */
.tbl-wrap { max-height: 320px; overflow-y: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.tbl th {
  text-align: left; padding: 6px 8px;
  font-size: 11px; color: var(--muted); font-weight: 400;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg2);
}
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--bg3); }

/* ─── Tags / badges ────────────────────────────── */
.tag {
  display: inline-block; font-size: 10px; padding: 2px 7px;
  border-radius: 20px; background: var(--bg3);
  border: 1px solid var(--border); color: var(--muted);
}
.tag-builtin { background: rgba(79,142,247,.1); border-color: rgba(79,142,247,.3); color: var(--accent); }
.tag-learned { background: rgba(52,201,138,.1); border-color: rgba(52,201,138,.3); color: var(--green); }
.tag-custom  { background: rgba(245,166,35,.1);  border-color: rgba(245,166,35,.3);  color: var(--amber); }

/* ─── Section labels ───────────────────────────── */
.slbl {
  font-size: 10px; font-weight: 500; text-transform: uppercase;
  letter-spacing: .07em; color: var(--muted); padding: 10px 0 4px;
}

/* ─── Code ─────────────────────────────────────── */
code { font-family: var(--mono); font-size: 11px; background: var(--bg3); padding: 1px 6px; border-radius: 4px; }

/* ─── Toast ────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 16px;
  font-size: 13px; opacity: 0; transform: translateY(10px);
  transition: all .25s; pointer-events: none; z-index: 999;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ─── Google Sheets specific ───────────────────── */
.sheets-info { font-size: 12px; color: var(--muted); line-height: 1.7; }
.sheets-info a { color: var(--accent); text-decoration: none; }
.sheets-info a:hover { text-decoration: underline; }
.year-purge-zone {
  border: 1px dashed var(--red);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-top: 14px;
}
.year-purge-zone h3 { color: var(--red) !important; }

/* ─── Chart canvases ───────────────────────────── */
.chart-wrap { position: relative; }
.chart-wrap canvas { display: block; }

/* ─── Responsive ───────────────────────────────── */
@media (max-width: 900px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .fr3, .fr4 { grid-template-columns: 1fr 1fr; }
  header { flex-direction: column; height: auto; padding: 10px 16px; gap: 8px; }
  #nav { width: 100%; }
  main { padding: 14px 16px; }
}
@media (max-width: 600px) {
  .fr2, .fr3, .fr4 { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: 1fr 1fr; }
}

// ─── Categorizer ─────────────────────────────────────────────────────────────
// Matches a merchant description against RULES (first match wins).
// Returns { cat, conf, src }.

function categorize(desc) {
  const d = desc.toLowerCase();
  for (const r of RULES) {
    if (d.includes(r.kw.toLowerCase())) {
      // Confidence: base 52 + 3 per keyword char + bonus for learned/custom
      const bonus = r.src === 'learned' ? 15 : r.src === 'custom' ? 8 : 0;
      const conf  = Math.min(97, 52 + r.kw.length * 3 + bonus);
      return { cat: r.cat, conf, src: r.src };
    }
  }
  return { cat: 'Miscellaneous', conf: 18, src: 'default' };
}

// Called whenever a user manually corrects a category in the import preview.
// Extracts the first 2 meaningful words from the description and adds a rule.
function learnFromCorrection(desc, correctedCat) {
  const stopWords = new Set(['the','and','for','from','inc','llc','com','dba','usa','corp']);
  const words = desc
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .trim()
    .split(/\s+/)
    .filter(w => w.length > 2 && !stopWords.has(w));

  if (!words.length) return;
  const kw = words.slice(0, 2).join(' ');
  if (kw.length < 3) return;

  // Don't duplicate
  if (RULES.find(r => r.kw === kw && r.cat === correctedCat)) return;

  RULES.unshift({ kw, cat: correctedCat, src: 'learned' });
  Storage.saveRules();
}
// ─── Storage ──────────────────────────────────────────────────────────────────
// All state stored under knb_<key> in localStorage.
// Data is year-keyed: TXNS[year][month], BUD[year][month], etc.

const Storage = (() => {
  const K = {
    TXNS:  'knb_txns',
    INCSRC:'knb_incsrc',
    CATS:  'knb_cats',
    CALI:  'knb_cali',
    GOALS: 'knb_goals',
    DEBTS: 'knb_debts',
    INVS:  'knb_investments',
    PROJS: 'knb_projects',
    RULES: 'knb_rules',
    BUD:   'knb_budget',
    SKI:   'knb_skeleton',
    DTDI:  'knb_dtd',
  };

  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); }
    catch(e) { console.warn('localStorage full?', e); }
  }
  function load(key, fallback) {
    try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }
    catch(e) { return fallback; }
  }

  // ── Seed helpers ─────────────────────────────────────────────────────────────
  function seedBudget() {
    // Merge seed data into loaded BUD/SKI/DTDI/CALI without overwriting user changes
    const bud  = load(K.BUD,  {});
    const ski  = load(K.SKI,  {});
    const dtdi = load(K.DTDI, {});
    const cali = load(K.CALI, {});

    for (const [yr, months] of Object.entries(SEED_BUDGET)) {
      if (!bud[yr]) bud[yr] = {};
      for (const [m, v] of Object.entries(months)) {
        if (!bud[yr][m]) bud[yr][m] = v;  // only seed if no user data
      }
    }
    for (const [yr, months] of Object.entries(SEED_SKELETON)) {
      if (!ski[yr]) ski[yr] = {};
      for (const [m, v] of Object.entries(months)) {
        if (!ski[yr][m]) ski[yr][m] = v;
      }
    }
    for (const [yr, months] of Object.entries(SEED_DTD)) {
      if (!dtdi[yr]) dtdi[yr] = {};
      for (const [m, v] of Object.entries(months)) {
        if (!dtdi[yr][m]) dtdi[yr][m] = v;
      }
    }
    // Seed CALI
    for (const [yr, months] of Object.entries(SEED_CALI)) {
      if (!cali[yr]) cali[yr] = {};
      for (const [m, v] of Object.entries(months)) {
        if (!cali[yr][m]) cali[yr][m] = v;
      }
    }
    return { bud, ski, dtdi, cali };
  }

  // ── Ensure a year+month exists ────────────────────────────────────────────────
  function ensureMonth(year, month) {
    if (!window.BUD[year])  window.BUD[year]  = {};
    if (!window.SKI[year])  window.SKI[year]  = {};
    if (!window.DTDI[year]) window.DTDI[year] = {};
    if (!window.TXNS[year]) window.TXNS[year] = {};
    if (!window.INCSRC[year]) window.INCSRC[year] = {};
    if (!window.INCSRC[year][month]) window.INCSRC[year][month] = [];
    if (!window.CALI[year])  window.CALI[year]  = {};
    if (!window.CALI[year][month]) window.CALI[year][month] = [];
    if (!window.BUD[year][month])  window.BUD[year][month]  = defaultBudgetMonth();
    if (!window.SKI[year][month])  window.SKI[year][month]  = defaultSkeleton();

        for (const i of ((window.CALI[year]||{})[m]||[])) {

        }
      }
      downloadCSV(rows, `budget-calendar-${year}.csv`);
    },

    // ── Export: full year JSON snapshot ────────────────────────────────────────
    exportJSON(year) {
      const snapshot = {
        exportedAt:   new Date().toISOString(),
        year,
        transactions: window.TXNS[year] || {},
        budget:       (window.BUD[year]  || {}),
        goals:        window.GOALS,
        debts:        window.DEBTS,
        investments:  window.INVS,
        projects:     window.PROJS,
        customRules:  RULES.filter(r => r.src !== 'built-in'),
      };
      const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type:'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = `budget-backup-${year}.json`; a.click();
      URL.revokeObjectURL(url);
      toast('JSON backup downloaded.', 'ok');
    },

    // ── Year-end purge (after confirming export) ────────────────────────────────
    purgeYear(year) {
      delete window.TXNS[year];
      if (window.INCSRC[year]) { Object.values(window.INCSRC[year]).forEach(arr => arr.forEach(i => { i.a = 0; })); }
      if (window.BUD[year])  { Object.values(window.BUD[year]).forEach(b  => { b.income=0; b.sk=0; b.dtd=0; b.cal=0; b.nm=0; }); }
      if (window.CALI[year]) { Object.values(window.CALI[year]).forEach(arr => arr.forEach(i => i.a = 0)); }
      if (window.SKI[year])  { Object.values(window.SKI[year]).forEach(arr => arr.forEach(i => i.a = 0)); }
      if (window.DTDI[year]) { Object.values(window.DTDI[year]).forEach(arr => arr.forEach(i => i.a = 0)); }
      this.saveTxns();
      this.saveBudget();
      toast(`${year} cleared. Ready for new year.`, 'ok');
    },
  };
})();

// ─── CSV download helper ───────────────────────────────────────────────────────
function downloadCSV(rows, filename) {
  const csv  = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast(`${filename} downloaded.`, 'ok');
}

// ─── Import Tab ───────────────────────────────────────────────────────────────
const Import = (() => {
  let _parsed = [];

  function catOptions(selected) {
    return CATS.map(c =>
      `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`
    ).join('');
  }

  function curMonth() { return MONTHS[new Date().getMonth()]; }
  function curYear()  { return new Date().getFullYear(); }

  // ── Parse raw text (paste or CSV lines) ──────────────────────────────────────
  // Supports your bank export: Date, Description, Original Description, Category, Amount
  // Amount: negative = expense, positive = income
  function parseLines(raw, hasHeader) {
    const lines = raw.split('\n').filter(l => l.trim());
    const start = hasHeader ? 1 : 0;
    const results = [];

    // Detect column layout from header if present
    let dateCol=0, descCol=1, amtCol=4;  // default: bank export layout
    if (hasHeader && lines[0]) {
      const h = lines[0].toLowerCase().split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(p=>p.trim().replace(/^"|"$/g,''));
      const di = h.findIndex(x => x.includes('date'));
      const dsi= h.findIndex(x => x === 'description');
      const ai = h.findIndex(x => x.includes('amount'));
      if (di >= 0) dateCol = di;
      if (dsi >= 0) descCol = dsi;
      if (ai >= 0) amtCol  = ai;
    }

    for (let li = start; li < lines.length; li++) {
      const parts = lines[li].split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/)
                              .map(p => p.trim().replace(/^"|"$/g, ''));
      if (parts.length < 2) continue;

      const dateRaw = (parts[dateCol] || '').trim();
      const desc    = (parts[descCol] || '').trim();
      const amtRaw  = (parts[amtCol]  || parts[1] || '').replace(/[$,\s]/g, '');
      const amt     = parseFloat(amtRaw);
      if (!dateRaw || isNaN(amt)) continue;

      // Bank export: negative = expense, positive = income (matches your format)
      const res = categorize(desc);
      results.push({
        date:     dateRaw,
        amount:   Math.abs(amt),
        desc,
        cat:      res.cat,
        conf:     res.conf,
        autoSrc:  res.src,
        type:     amt < 0 ? 'expense' : 'income',
      });
    }
    return results;
  }

  // ── Handle CSV file upload ────────────────────────────────────────────────────
  function handleCSV(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const text = e.target.result.replace(/^\uFEFF/, ''); // strip BOM
      const lines = text.split('\n').filter(l => l.trim());
      const firstLower = (lines[0] || '').toLowerCase();
      const hasHeader = firstLower.includes('date') || firstLower.includes('amount') || firstLower.includes('description');
      _parsed = parseLines(text, hasHeader);
      // Auto-set month/year from first transaction date if parseable
      if (_parsed.length) {
        const d = new Date(_parsed[0].date);
        if (!isNaN(d)) {
          const mo = MONTHS[d.getMonth()];
          const yr = d.getFullYear();
          document.getElementById('imp-month').value = mo;
          document.getElementById('imp-year').value  = yr;
        }
      }
      renderPreview();
    };
    reader.readAsText(file);
  }

  // ── Paste parse ───────────────────────────────────────────────────────────────
  function doParse() {
    const raw = document.getElementById('imp-paste').value.trim();
    if (!raw) { showMsg('imp-msg', 'Nothing to parse — paste rows or upload a CSV.', 'err'); return; }
    const lines = raw.split('\n').filter(l => l.trim());
    const firstLower = (lines[0] || '').toLowerCase();
    const hasHeader = firstLower.includes('date') || firstLower.includes('amount') || firstLower.includes('description');
    _parsed = parseLines(raw, hasHeader);
    if (_parsed.length) {
      const d = new Date(_parsed[0].date);
      if (!isNaN(d)) {
        document.getElementById('imp-month').value = MONTHS[d.getMonth()];
        document.getElementById('imp-year').value  = d.getFullYear();
      }
    }
    renderPreview();
  }

  // ── Transfer detection ───────────────────────────────────────────────────────
  // Known recurring USAA transfer amounts that ARE real expenses (not internal moves)
  // These are whitelisted so they don't get flagged as internal transfers.
  const TRANSFER_WHITELIST_AMTS = new Set([
    3880.30,  // Mortgage
    310.00,   // FL Prepaid
    215.00,   // Life Insurance
    339.21, 339.22, // USAA Insurance
    843.99,   // Girls Doctors transfer
    1000.00,  // Emergency Fund
    2025.00,  // Savings deposit
  ]);

  const TRANSFER_KEYWORDS = [
    'usaa transfer','usaa funds transfer','usaa checking','usaa savings',
    'online transfer to','online transfer from','transfer to chk',
    'transfer to sav','transfer between','account transfer',
    'internal transfer','xfer'
  ];

  function _transferStatus(t) {
    const d = t.desc.toLowerCase();
    const isTransferKeyword = TRANSFER_KEYWORDS.some(kw => d.includes(kw));
    const isTransferCat     = t.cat === 'Internal Transfer';

    if (!isTransferKeyword && !isTransferCat) return null;

    // Whitelisted amounts are known real expenses — don't flag them
    if (TRANSFER_WHITELIST_AMTS.has(t.amount)) return null;

    // If it matches a known savings cat it's intentional — flag as savings not transfer
    if (t.cat === 'Savings: Emergency Fund') return null;

    return 'transfer';  // flag for review
  }

  // ── Duplicate detection ──────────────────────────────────────────────────────
  // A duplicate is an existing transaction with same date + amount + first 12 chars of desc.
  // Returns 'exact' | 'likely' | null
  function _dupStatus(t, month, year) {
    const existing = (window.TXNS[year]?.[month]) || [];
    const descKey  = t.desc.toLowerCase().slice(0, 12);
    for (const e of existing) {
      const sameAmt  = Math.abs(e.amount - t.amount) < 0.01;
      const sameDesc = e.desc.toLowerCase().slice(0, 12) === descKey;
      const sameDate = e.date === t.date;
      if (sameAmt && sameDesc && sameDate)  return 'exact';
      if (sameAmt && sameDesc)              return 'likely';  // same amount+merchant, diff date
    }
    return null;
  }

  function renderPreview() {
    const month = document.getElementById('imp-month').value;
    const year  = parseInt(document.getElementById('imp-year').value);
    if (!_parsed.length) {
      showMsg('imp-msg', 'Could not parse any rows. Expected columns: Date, Description, Original Description, Category, Amount.', 'err');
      return;
    }

    // Tag each row with duplicate and transfer status
    _parsed.forEach(t => {
      t._dup      = _dupStatus(t, month, year);
      t._transfer = !t._dup ? _transferStatus(t) : null;  // only flag transfer if not already a dup
    });

    const exactDups   = _parsed.filter(t => t._dup === 'exact').length;
    const likelyDups  = _parsed.filter(t => t._dup === 'likely').length;
    const transfers   = _parsed.filter(t => t._transfer === 'transfer').length;
    const clean       = _parsed.filter(t => !t._dup && !t._transfer).length;
    const hiCount     = _parsed.filter(t => t.conf >= 60 && !t._dup && !t._transfer).length;

    // Build flags banner
    let dupBanner = '';
    const hasFlagged = exactDups || likelyDups || transfers;
    if (hasFlagged) {
      dupBanner = `<div class="alert alert-warn" style="margin-bottom:10px">
        <strong>Review flagged rows:</strong><br>
        ${exactDups  ? `🔴 <strong>${exactDups} exact duplicate${exactDups>1?'s':''}</strong> — same date, amount &amp; merchant already imported.<br>` : ''}
        ${likelyDups ? `🟡 <strong>${likelyDups} possible duplicate${likelyDups>1?'s':''}</strong> — same amount &amp; merchant, different date.<br>` : ''}
        ${transfers  ? `🟣 <strong>${transfers} possible internal transfer${transfers>1?'s':''}</strong> — USAA transfer detected. Categorized as Internal Transfer. Remove if this is truly an internal move between your own accounts, or change category if it's a real expense.` : ''}
      </div>`;
    }

  }

  function _correct(i, cat) {
    learnFromCorrection(_parsed[i].desc, cat);
    _parsed[i].cat = cat;

  function _remove(i) {

  function _removeAllDups() {

  const SK_CATS = new Set([
    'Mortgage','Electric','Water','Mowing','Lawn Treatment','ADT Security',
    'Cell Phones','Grace Coaching','Mohela','Sallie Mae','Nelnet',
    'Life Insurance Plans','Killian Life Insurance','FL Prepaid','Killian FL Prepaid',

  ]);

  // ── Rebuild actuals for a given year+month from raw transactions ─────────────
  // Called immediately after every import or single-add so budget + dashboard
  // reflect the new data without needing a refresh.
  function _refreshBudgetActuals(year, month) {
    Storage.ensureMonth(year, month);
    const txns = (window.TXNS[year]?.[month]) || [];
    const b    = window.BUD[year][month];
    const sk   = window.SKI[year][month]   || [];
    const dtd  = window.DTDI[year][month]  || [];
    const cal  = (window.CALI[year]?.[month]) || [];
    const inc  = (window.INCSRC[year]?.[month]) || [];

    // 1. Reset all actuals to zero
    sk.forEach(li  => li.a = 0);
    dtd.forEach(li => li.a = 0);
    cal.forEach(li => li.a = 0);
    b.income = 0; b.sk = 0; b.dtd = 0; b.cal = 0; b.nm = 0;

    // 2. Walk every transaction and accumulate
    for (const t of txns) {
      const amt = Number(t.amount) || 0;

      // Internal transfers are neither income nor expense — skip entirely
      if (t.cat === 'Internal Transfer') continue;

      if (t.type === 'income') {
        b.income += amt;

        // Determine the income source name from category or description
        let srcName = 'Other Income';
        const catLow  = (t.cat  || '').toLowerCase();
        const descLow = (t.desc || '').toLowerCase();

        if (catLow.includes('phillip') || catLow.includes('pmk') ||
            descLow.includes('pmk') || descLow.includes('phillip') ||
            descLow.includes('extensis')) {
          srcName = 'Phillip - PMK';
        } else if (catLow.includes('meredith') || catLow.includes('mrn') ||
                   descLow.includes('mrn') || descLow.includes('meredith') ||
                   descLow.includes('other payroll')) {
          srcName = 'Meredith - MRN';
        } else if (catLow.includes('bonus') || descLow.includes('bonus')) {
          srcName = 'Bonus';
        }

        // Find existing income source line or auto-create it
        let il = inc.find(i => i.n === srcName);
        if (!il) {
          il = { n: srcName, p: 0, a: 0 };
          inc.push(il);
        }
        il.a = (il.a || 0) + amt;
        continue;
      }

      // 3. Roll up to BUD section totals — category drives the bucket
      // Calendar/one-time categories route to cal bucket
      const CAL_CATS = new Set([
        'Valentines','Hailey Valentines','Payton Birthday','Monthly Date Night',
        'Travel Plans','Family Entertainment','Entertainment',
        "Mother's Day","Father's Day",'Holiday','Christmas','Thanksgiving',
        'Birthday','Anniversary','Wedding Gift','School Supplies'
      ]);

      if (SK_CATS.has(t.cat)) {
        b.sk += amt;
      } else if (CAL_CATS.has(t.cat)) {
        b.cal += amt;
        // Match to a calendar line item if one exists
        const calItem = cal.find(li =>
          li.n.toLowerCase().replace(/[^a-z]/g,'').includes(
            t.cat.toLowerCase().replace(/[^a-z]/g,'').slice(0,8)
          ) ||
          t.desc.toLowerCase().includes(li.n.toLowerCase().slice(0,6))
        );
        if (calItem) calItem.a = (calItem.a || 0) + amt;
      } else {
        b.dtd += amt;
      }

      // 4. Match to a line item — first try exact category match on item name,
      //    then fall back to partial. This is separate from the section rollup
      //    so totals are always correct even if no line item matches.
      const allItems = [...sk, ...dtd];
      let matched = null;

      // Try: line item name contains the transaction category (most reliable)
      if (t.cat && t.cat !== 'Miscellaneous') {
        matched = allItems.find(li =>
          li.n.toLowerCase().replace(/[^a-z0-9]/g, '').includes(
            t.cat.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 10)
          )
        );
      }
      // Fallback: transaction description contains item name
      if (!matched && t.desc) {
        matched = allItems.find(li =>
          t.desc.toLowerCase().includes(li.n.toLowerCase().slice(0, 6))
        );
      }
      if (matched) matched.a = (matched.a || 0) + amt;
    }

    // 5. Re-derive BUD totals from line items as source of truth for the
    //    budget tab (section totals already set above for dashboard)
    // (line items are displayed individually; BUD.sk/dtd drive dashboard cards)
  }

  // ── After any import, force all mounted tabs to re-render ────────────────────
  function _rerenderAll(year, month) {

    if (window._mounted && window._mounted['dashboard']) {

    if (window._mounted && window._mounted['budget']) {

      if (bm) bm.value = month;
      if (by) by.value = String(year);
      Budget.render();

    if (window._mounted && window._mounted['goals'])  Goals.render();
    if (window._mounted && window._mounted['invest']) Invest.render();
    if (window._mounted && window._mounted['txns'])   TxnsTab.render();
  }

  function addSingle() {

  function mount() {

          <div><label>Month</label><select id="s-month">${monthOpts()}</select></div>

        </div>

  }

  return { mount, _doParse:doParse, _handleCSV:handleCSV, _correct, _remove, _importAll, _importNew, _removeAllDups, _removeTransfers, _addSingle:addSingle, _refreshActuals };
})();
// ─── Budget Tab ───────────────────────────────────────────────────────────────

  function _catsForItem(itemName) {
    if (LINE_CAT_MAP[itemName]) return LINE_CAT_MAP[itemName];
    const low = itemName.toLowerCase();
    for (const [k,v] of Object.entries(LINE_CAT_MAP)) {
      if (k.toLowerCase() === low) return v;
    }
    return [itemName];
  }

  function _scoreMatch(t, item, targetCats) {
    const tCat  = (t.cat  || '').toLowerCase();
    const tDesc = (t.desc || '').toLowerCase();
    for (const c of targetCats) { if (tCat === c.toLowerCase()) return 3; }
    for (const c of targetCats) { const cL=c.toLowerCase(); if (tCat.includes(cL)||cL.includes(tCat)) return 2; }
    const itemWords = item.n.toLowerCase().split(/[\s\/\-&]+/).filter(w=>w.length>3);
    const catWords  = tCat.split(/[\s\/\-&,()]+/).filter(w=>w.length>3);
    if (itemWords.some(w=>catWords.some(c=>c.includes(w)||w.includes(c)))) return 2;
    if (itemWords.some(w=>tDesc.includes(w))) return 1;
    return 0;
  }

    const arr  = _getArr(sectionKey);
    const item = arr[idx];
    if (!item) return '<p class="muted" style="font-size:12px">Item not found.</p>';

    const txns       = (window.TXNS[year]?.[m]) || [];
    const targetCats = _catsForItem(item.n);
    const catOpts    = CATS.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');

    const matched = txns
      .map((t,i) => ({ t, i, score: _scoreMatch(t, item, targetCats) }))
      .filter(x => x.score > 0 && x.t.type !== 'income' && x.t.cat !== 'Internal Transfer')
      .sort((a,b) => b.score - a.score || b.t.date.localeCompare(a.t.date));

    const total    = matched.reduce((s,x) => s+x.t.amount, 0);
    const allTxns  = txns.map((t,i)=>({t,i})).filter(x=>x.t.type!=='income'&&x.t.cat!=='Internal Transfer');
    const diff     = Math.abs(total - item.a);

    const statusHtml = diff < 0.05
      ? `<span style="font-size:11px;color:var(--green)">✓ Matches line total</span>`
      : `<span style="font-size:11px;color:var(--amber)">⚠ Matched ${fmt(total)} vs line ${fmt(item.a)}
           — adjust categories below or in Transactions tab</span>`;

    if (!matched.length) {
      const allRows = allTxns.slice(0,20).map(({t,i}) => `
        <tr>
          <td style="color:var(--muted)">${t.date}</td>
          <td title="${escHtml(t.desc)}">${escHtml(t.desc.slice(0,24))}</td>
          <td>
            <select style="width:100%;font-size:10px;padding:1px 3px"
                    onchange="Budget._remapTxn(${year},'${m}',${i},this.value)">
              ${catOpts.replace(`value="${escHtml(t.cat)}"`,`value="${escHtml(t.cat)}" selected`)}
            </select>
          </td>
          <td style="text-align:right;color:var(--red)">-${fmt(t.amount)}</td>
          <td><button class="btn btn-sm btn-danger" onclick="Budget._removeTxn(${year},'${m}',${i})"
                      style="font-size:10px;padding:1px 5px">✕</button></td>
        </tr>`).join('');

      return `<div style="background:var(--bg3);border-radius:var(--radius);padding:10px 12px;font-size:12px">
        <p style="color:var(--amber);margin-bottom:8px">
          No transactions matched to <strong>"${escHtml(item.n)}"</strong> in ${m} ${year}.<br>
          <span style="font-size:11px;color:var(--muted)">Looking for categories: <strong>${targetCats.join(', ')}</strong></span>
        </p>
        <p style="font-size:11px;color:var(--muted);margin-bottom:8px">
          Remap any transaction below to add it to this line, or go to the <strong>Transactions</strong> tab to review all.
        </p>
        ${allTxns.length ? `<table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr>
            <th style="text-align:left;color:var(--muted);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--border);width:13%">Date</th>
            <th style="text-align:left;color:var(--muted);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--border)">Description</th>
            <th style="text-align:left;color:var(--muted);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--border);width:28%">Remap category</th>
            <th style="text-align:right;color:var(--muted);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--border);width:12%">Amount</th>
            <th style="width:8%"></th>
          </tr></thead>
          <tbody>${allRows}</tbody>
        </table>` : '<p class="muted" style="font-size:11px">No transactions imported yet.</p>'}
      </div>`;
    }

    const rows = matched.map(({t,i}) => `
      <tr>
        <td style="color:var(--muted);white-space:nowrap">${t.date}</td>
        <td title="${escHtml(t.desc)}">${escHtml(t.desc.slice(0,24))}</td>
        <td>
          <select style="width:100%;font-size:10px;padding:1px 3px"
                  onchange="Budget._remapTxn(${year},'${m}',${i},this.value)">
            ${catOpts.replace(`value="${escHtml(t.cat)}"`,`value="${escHtml(t.cat)}" selected`)}
          </select>
        </td>
        <td style="text-align:right;color:var(--red);font-weight:500">-${fmt(t.amount)}</td>
        <td><button class="btn btn-sm btn-danger" onclick="Budget._removeTxn(${year},'${m}',${i})"
                    style="font-size:10px;padding:1px 5px" title="Remove this transaction">✕</button></td>
      </tr>`).join('');

    return `<div style="background:var(--bg3);border-radius:var(--radius);padding:10px 12px;font-size:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:4px">
        <span style="font-weight:500">${matched.length} matched — total: <span class="neg">${fmt(total)}</span></span>
        ${statusHtml}
      </div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:6px">
        Categories matched: ${targetCats.join(', ')} &nbsp;·&nbsp;
        Change a category to remap it (teaches auto-cat too)
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr>
          <th style="text-align:left;color:var(--muted);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--border);width:13%">Date</th>
          <th style="text-align:left;color:var(--muted);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--border)">Description</th>
          <th style="text-align:left;color:var(--muted);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--border);width:28%">Category</th>
          <th style="text-align:right;color:var(--muted);font-weight:400;padding:3px 6px;border-bottom:1px solid var(--border);width:12%">Amount</th>
          <th style="width:8%"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  // ── Income source helpers ────────────────────────────────────────────────────
  const INCOME_TYPES = ['Paycheck - MRN (Meredith)','Paycheck - PMK (Phillip)','Bonus','Side Income','Reimbursement','Transfer In','Other'];

  function _getInc() {
    const { m, year } = getYM();
    if (!window.INCSRC[year])    window.INCSRC[year]    = {};
    if (!window.INCSRC[year][m]) window.INCSRC[year][m] = [];
    return window.INCSRC[year][m];
  }

  function incomeLine(it, idx) {
    const diff = (it.a||0) - (it.p||0);
    const type = it.sourceType || '';
    return `<div style="border-bottom:1px solid var(--border);padding:8px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <div style="flex:1;min-width:180px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-weight:500;font-size:13px">${escHtml(it.n)}</span>
            <select style="font-size:10px;padding:2px 5px;background:var(--bg3);
                           border:1px solid var(--border);border-radius:4px;color:var(--muted)"
                    onchange="Budget._setIncomeType(${idx},this.value)">
              <option value="">type…</option>
              ${INCOME_TYPES.map(t=>`<option value="${t}"${t===type?' selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">Expected: ${fmt(it.p||0)}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div style="text-align:right">
            <div class="pos" style="font-size:14px;font-weight:500">${fmt(it.a||0)}</div>
            ${(it.p||0)>0?`<div style="font-size:11px;color:${diff>=0?'var(--green)':'var(--red)'}">
              ${diff>=0?'+':''}${fmt(diff)} vs expected</div>`:''}
          </div>
          <button class="btn btn-sm" onclick="Budget._editIncome(${idx})"
                  style="font-size:10px;padding:2px 7px">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="Budget._deleteIncome(${idx})"
                  style="font-size:10px;padding:2px 6px">✕</button>
        </div>
      </div>
    </div>`;
  }

  // ── Main render ───────────────────────────────────────────────────────────────
  function render() {
    const { m, year } = getYM();
    Storage.ensureMonth(year, m);
    const b   = window.BUD[year][m];
    const sk  = window.SKI[year][m]   || [];
    const dtd = window.DTDI[year][m]  || [];
    const cal = window.CALI[year]?.[m] || [];
    const inc = window.INCSRC[year]?.[m] || [];

    const totalInc  = inc.reduce((s,i)  => s+(i.a||0), 0);
    const planInc   = inc.reduce((s,i)  => s+(i.p||0), 0);
    const totalSk   = sk.reduce((s,i)   => s+(i.a||0), 0);
    const totalDtd  = dtd.reduce((s,i)  => s+(i.a||0), 0);
    const totalCal  = cal.reduce((s,i)  => s+(i.a||0), 0);
    const totalExp  = totalSk+totalDtd+totalCal;
    const net       = totalInc-totalExp;

    b.income=totalInc; b.sk=totalSk; b.dtd=totalDtd; b.cal=totalCal; b.pI=planInc;

    document.getElementById('bud-metrics').innerHTML = `
      <div class="metric"><div class="lbl">Planned Income</div><div class="val">${fmt(planInc)}</div></div>
      <div class="metric"><div class="lbl">Actual Income</div><div class="val pos">${fmt(totalInc)}</div></div>
      <div class="metric"><div class="lbl">Total Expenses</div><div class="val neg">${fmt(totalExp)}</div></div>
      <div class="metric"><div class="lbl">Net</div><div class="val ${net>=0?'pos':'neg'}">${fmt(net)}</div></div>
    `;

    const addBtn = key => `<button class="btn btn-sm"
        style="float:right;margin-top:-2px" onclick="Budget._addLine('${key}')">+ Add</button>`;

    document.getElementById('bud-lines').innerHTML = `
      <div class="slbl">Monthly Bills ${addBtn('sk')}</div>
      ${sk.map((it,i)=>lineItemHtml(it,'sk',i)).join('')||'<p class="muted" style="font-size:12px;padding:4px 0">No items.</p>'}

      <div class="slbl" style="margin-top:12px">Day to Day ${addBtn('dtd')}</div>
      ${dtd.map((it,i)=>lineItemHtml(it,'dtd',i)).join('')||'<p class="muted" style="font-size:12px;padding:4px 0">No items.</p>'}

      <div class="slbl" style="margin-top:12px">
        Calendar &amp; One-Time
        <span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:6px">birthdays, holidays, travel…</span>
        ${addBtn('cal')}
      </div>
      ${cal.length ? cal.map((it,i)=>lineItemHtml(it,'cal',i)).join('') : '<p class="muted" style="font-size:12px;padding:4px 0">No calendar items — click + Add.</p>'}

      <div class="slbl" style="margin-top:16px;border-top:1px solid var(--border);padding-top:10px">
        Income Sources
        <button class="btn btn-sm" style="float:right;margin-top:-2px" onclick="Budget._addIncome()">+ Add</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">
        Income auto-populates from imported transactions. Add sources manually or set expected amounts.
      </div>
      ${inc.length ? inc.map((it,i)=>incomeLine(it,i)).join('') : '<p class="muted" style="font-size:12px;padding:4px 0">No income sources yet — import transactions or add manually.</p>'}
    `;
  }

  // ── Line item CRUD ────────────────────────────────────────────────────────────
  function _getArr(sectionKey) {
    const { m, year } = getYM();
    Storage.ensureMonth(year, m);
    if (sectionKey === 'sk')  return window.SKI[year][m];
    if (sectionKey === 'cal') {
      if (!window.CALI[year])    window.CALI[year]    = {};
      if (!window.CALI[year][m]) window.CALI[year][m] = [];
      return window.CALI[year][m];
    }
    return window.DTDI[year][m];
  }

  function _addLine(sectionKey) {
    const name    = prompt('Item name:');
    if (!name) return;
    const planned = parseFloat(prompt('Planned / budgeted amount ($):', '0')) || 0;
    const actual  = parseFloat(prompt('Actual spent ($):', '0')) || 0;
    _getArr(sectionKey).push({ n:name.trim(), p:planned, a:actual });
    Storage.saveBudget(); render();
  }
  function _editLine(sectionKey, idx) {
    const arr  = _getArr(sectionKey);
    const item = arr[idx];
    const name    = prompt('Item name:', item.n);
    if (name===null) return;
    const planned = parseFloat(prompt('Planned ($):', item.p)) || 0;
    const actual  = parseFloat(prompt('Actual ($):', item.a))  || 0;
    arr[idx] = { n:name.trim(), p:planned, a:actual };
    Storage.saveBudget(); render();
  }
  function _deleteLine(sectionKey, idx) {
    const arr = _getArr(sectionKey);
    if (!confirm(`Delete "${arr[idx].n}"?`)) return;
    arr.splice(idx, 1);
    Storage.saveBudget(); render();
  }

  // ── Income CRUD ───────────────────────────────────────────────────────────────
  function _addIncome() {
    const name    = prompt('Income source (e.g. Meredith - MRN, Phillip - PMK, Bonus):');
    if (!name) return;
    const planned = parseFloat(prompt('Expected amount ($):', '0'))  || 0;
    const actual  = parseFloat(prompt('Actual received ($):', '0'))  || 0;
    const type    = prompt('Type (Paycheck - MRN / Paycheck - PMK / Bonus / Other):', 'Paycheck - MRN') || '';
    _getInc().push({ n:name.trim(), p:planned, a:actual, sourceType:type.trim() });
    Storage.saveBudget(); render();
  }
  function _editIncome(idx) {
    const arr  = _getInc();
    const item = arr[idx];
    const name    = prompt('Income source:', item.n);
    if (name===null) return;
    const planned = parseFloat(prompt('Expected ($):', item.p)) || 0;
    const actual  = parseFloat(prompt('Actual ($):', item.a))   || 0;
    arr[idx] = { ...item, n:name.trim(), p:planned, a:actual };
    Storage.saveBudget(); render();
  }
  function _deleteIncome(idx) {
    const arr = _getInc();
    if (!confirm(`Delete "${arr[idx].n}"?`)) return;
    arr.splice(idx, 1);
    Storage.saveBudget(); render();
  }
  function _setIncomeType(idx, type) {
    const arr = _getInc();
    if (!arr[idx]) return;
    arr[idx].sourceType = type;
    Storage.saveBudget();
    toast(`Source type set to "${type}".`, 'ok');
  }

  // ── Mount ─────────────────────────────────────────────────────────────────────
  function mount() {
    const y = new Date().getFullYear();
    const curM = MONTHS[new Date().getMonth()];
    const yearOpts = Array.from({length:12},(_,i)=>y-2+i)
      .map(yr=>`<option value="${yr}"${yr===y?' selected':''}>${yr}</option>`).join('');
    const el = document.getElementById('tab-budget');
    el.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:14px;align-items:flex-end;flex-wrap:wrap">
        <div><label>Month</label>
          <select id="bud-month">${MONTHS.map(m=>`<option${m===curM?' selected':''}>${m}</option>`).join('')}</select>
        </div>
        <div><label>Year</label>
          <select id="bud-year">${yearOpts}</select>
        </div>
        <button class="btn btn-sm" onclick="go('txns');TxnsTab.render()"
                style="align-self:flex-end">View all transactions →</button>
      </div>
      <div class="metrics" id="bud-metrics"></div>
      <div class="card" id="bud-lines"></div>
    `;
    document.getElementById('bud-month').addEventListener('change', render);
    document.getElementById('bud-year').addEventListener('change', render);
    render();
  }

  return { mount, render, _addLine, _editLine, _deleteLine,
           _addIncome, _editIncome, _deleteIncome, _setIncomeType,
           _toggleDetail, _removeTxn, _remapTxn };
})();

// ─── Goals Tab ────────────────────────────────────────────────────────────────
const Goals = (() => {
  let CH = {};
  function kc(id) { if (CH[id]) { CH[id].destroy(); delete CH[id]; } }

  function render() {
    const goals = window.GOALS || [];
    const total = goals.reduce((s, g) => s + g.target,  0);
    const saved = goals.reduce((s, g) => s + g.current, 0);
    const pct   = total > 0 ? Math.round(saved / total * 100) : 0;

    document.getElementById('goals-metrics').innerHTML = `
      <div class="metric"><div class="lbl">Total Target</div><div class="val">${fmt(total)}</div></div>
      <div class="metric"><div class="lbl">Total Saved</div><div class="val pos">${fmt(saved)}</div></div>
      <div class="metric"><div class="lbl">Still Needed</div><div class="val warn">${fmt(Math.max(0,total-saved))}</div></div>
      <div class="metric"><div class="lbl">Overall Progress</div><div class="val ${pct>=50?'pos':'warn'}">${pct}%</div></div>
    `;

    document.getElementById('goals-list').innerHTML = goals.map((g, i) => {
      const r   = g.target > 0 ? Math.min(g.current / g.target, 1) : 0;
      const cls = r >= 1 ? 'fill-ok' : r > 0.5 ? 'fill-warn' : 'fill-blue';
      const p   = g.target > 0 ? Math.round(r * 100) : 0;
      return `<div class="row" style="align-items:flex-start;padding:9px 0">
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:500">${escHtml(g.name)}</span>
            <span class="muted" style="font-size:11px">${p}%</span>
          </div>
          <div class="bar" style="height:5px;margin-top:5px">
            <div class="fill ${cls}" style="width:${p}%"></div>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:3px">${fmt(g.current)} of ${fmt(g.target)}</div>
        </div>
        <button class="btn btn-sm btn-danger" style="margin-left:12px;margin-top:2px"
                onclick="Goals._delete(${i})">✕</button>
      </div>`;
    }).join('') || '<p class="muted" style="font-size:12px;padding:8px 0">No goals yet.</p>';

    // Horizontal bar chart
    kc('c-goals');
    CH['c-goals'] = new Chart(document.getElementById('c-goals'), {
      type: 'bar',
      data: {
        labels: goals.map(g => g.name.length > 14 ? g.name.slice(0, 14) + '…' : g.name),
        datasets: [
          { label:'Saved',     data: goals.map(g => g.current), backgroundColor:'#34c98a', borderWidth:0, borderRadius:3 },
          { label:'Remaining', data: goals.map(g => Math.max(g.target - g.current, 0)),
            backgroundColor:'rgba(52,201,138,0.12)', borderWidth:0, borderRadius:3 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { stacked: false, ticks: { callback: v => '$'+Math.round(v/1000)+'k', font:{size:10} },
               grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { font:{size:10}, color:'#7b82a0' }, grid: { display:false } }
        }
      }
    });
  }

  function _delete(i) {
    if (!confirm(`Delete goal "${window.GOALS[i].name}"?`)) return;
    window.GOALS.splice(i, 1);
    Storage.saveGoals();
    render();
  }

  function _add() {
    const name    = document.getElementById('gn').value.trim();
    const current = parseFloat(document.getElementById('gc').value) || 0;
    const target  = parseFloat(document.getElementById('gt').value) || 0;
    if (!name) { showMsg('g-msg', 'Enter a goal name.', 'err'); return; }

    const ex = window.GOALS.find(g => g.name.toLowerCase() === name.toLowerCase());
    if (ex) { ex.current = current; ex.target = target; }
    else    { window.GOALS.push({ name, current, target }); }

    Storage.saveGoals();
    render();
    showMsg('g-msg', 'Goal saved.', 'ok');
    document.getElementById('gn').value = '';
    document.getElementById('gc').value = '';
    document.getElementById('gt').value = '';
  }

  function mount() {
    const el = document.getElementById('tab-goals');
    el.innerHTML = `
      <div class="metrics" id="goals-metrics"></div>
      <div class="grid2">
        <div><div class="card"><h3>Savings Goals</h3><div id="goals-list"></div></div></div>
        <div><div class="card"><h3>Progress Overview</h3>
          <div class="chart-wrap" style="height:220px"><canvas id="c-goals"></canvas></div>
        </div></div>
      </div>
      <div class="card">
        <h3>Add / Update Goal</h3>
        <div class="fr fr3" style="margin-bottom:10px">
          <div><label>Name</label><input type="text" id="gn" placeholder="Emergency Fund"></div>
          <div><label>Currently Saved ($)</label><input type="number" id="gc" placeholder="0"></div>
          <div><label>Target ($)</label><input type="number" id="gt" placeholder="0"></div>
        </div>
        <button class="btn btn-primary" onclick="Goals._add()">Save Goal</button>
        <div id="g-msg"></div>
      </div>
    `;
    render();
  }

  return { mount, render, _delete, _add };
})();
// ─── Debt Tab ─────────────────────────────────────────────────────────────────
const Debt = (() => {
  let CH = {};
  function kc(id) { if (CH[id]) { CH[id].destroy(); delete CH[id]; } }

  function render() {
    const extra  = parseFloat(document.getElementById('debt-extra')?.value) || 0;
    const strat  = document.getElementById('debt-strat')?.value || 'avalanche';
    const active = (window.DEBTS || []).filter(d => d.balance > 0);
    const totBal = active.reduce((s, d) => s + d.balance, 0);
    const totMin = active.reduce((s, d) => s + d.min,     0);
    const avgAPR = active.length ? active.reduce((s, d) => s + d.rate, 0) / active.length : 0;

    document.getElementById('debt-metrics').innerHTML = `
      <div class="metric"><div class="lbl">Total Debt</div><div class="val neg">${fmt(totBal)}</div></div>
      <div class="metric"><div class="lbl">Min Payments / Mo</div><div class="val warn">${fmt(totMin)}</div></div>
      <div class="metric"><div class="lbl">Avg APR</div><div class="val warn">${avgAPR.toFixed(1)}%</div></div>
      <div class="metric"><div class="lbl">Active Accounts</div><div class="val">${active.length}</div></div>
    `;

    document.getElementById('debt-list').innerHTML = (window.DEBTS || []).map((d, i) => `
      <div class="row">
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between">
            <span style="font-weight:500">${escHtml(d.name)}</span>
            <span class="${d.balance>0?'neg':'pos'}">${fmt(d.balance)}</span>
          </div>
          <div style="font-size:11px;color:var(--muted)">
            Min: ${fmt(d.min)}/mo &nbsp;·&nbsp; APR: ${d.rate}%
            ${d.balance===0 ? ' &nbsp;·&nbsp; <span style="color:var(--green)">✓ Paid off</span>' : ''}
          </div>
        </div>
        <button class="btn btn-sm btn-danger" style="margin-left:10px"
                onclick="Debt._delete(${i})">✕</button>
      </div>`).join('') || '<p class="muted" style="font-size:12px;padding:6px 0">No debts added yet.</p>';

    // Payoff simulation
    const sorted = [...active].sort((a, b) =>
      strat === 'avalanche' ? b.rate - a.rate : a.balance - b.balance
    );
    const snap = sorted.map(d => ({ ...d }));
    const cL = [], cD = [];
    let months = 0, bal = totBal;
    while (bal > 0 && months < 360) {
      for (const d of snap) {
        if (d.balance <= 0) continue;
        d.balance = Math.max(0, d.balance * (1 + d.rate / 1200) - d.min);
      }
      const focus = snap.find(d => d.balance > 0);
      if (focus && extra > 0) focus.balance = Math.max(0, focus.balance - extra);
      bal = snap.reduce((s, d) => s + Math.max(0, d.balance), 0);
      months++;
      if (months % 3 === 0 || bal <= 0) { cL.push('Mo ' + months); cD.push(Math.round(bal)); }
    }
    const y = Math.floor(months / 12), mo = months % 12;
    document.getElementById('debt-calc-out').innerHTML =
      `<div class="alert alert-info" style="margin-top:8px">
        Using <strong>${strat}</strong>${extra > 0 ? ` + <strong>${fmt(extra)}/mo extra</strong>` : ''},
        you'll be debt-free in
        <strong>${y > 0 ? y + 'y ' : ''}${mo > 0 ? mo + 'mo' : ''}</strong>
        ${months >= 360 ? '— consider increasing payments.' : ''}
      </div>`;

    kc('c-debt');
    CH['c-debt'] = new Chart(document.getElementById('c-debt'), {
      type: 'line',
      data: { labels: cL, datasets: [{
        label:'Balance', data: cD,
        borderColor:'#f05a5a', backgroundColor:'rgba(240,90,90,0.07)',
        tension:0.35, borderWidth:1.5, pointRadius:0, fill:true
      }]},
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins: { legend: { display:false } },
        scales: {
          y: { ticks:{ callback: v=>'$'+Math.round(v/1000)+'k', font:{size:10} }, grid:{color:'rgba(255,255,255,0.05)'} },
          x: { ticks:{ font:{size:10}, maxTicksLimit:8 }, grid:{display:false} }
        }
      }
    });
  }

              <div><label>Balance ($)</label><input type="number" id="db" placeholder="6493"></div>

        <td>

    panel.innerHTML = `
      <div style="font-weight:500;font-size:13px;margin-bottom:12px">

      </div>

      ${Object.keys(tickerMap).length ? `
      <div style="margin-bottom:14px">

  function _selectAcct(i) {

  function _addPurchase(acctIdx) {
    const inv    = window.INVS[acctIdx];
    const crypto = isCrypto(inv);
    const date   = document.getElementById('p-date')?.value;

  function renderGrowthChart(invs, contrib, rate, yrs, totInvested) {

const House = (() => {
  function statusBadge(p) {
    const r = p.quote > 0 ? p.saved / p.quote : 0;
    if (p.quote === 0)  return '<span class="tag">No quote</span>';
    if (r >= 1)         return '<span class="tag tag-learned">Funded ✓</span>';
    if (p.saved > 0)    return '<span class="tag tag-custom">Saving…</span>';
    return '<span class="tag">Pending</span>';
  }

  function render() {
    const projs = window.PROJS || [];
    const totQ  = projs.reduce((s, p) => s + (p.quote    || 0), 0);
    const totS  = projs.reduce((s, p) => s + (p.saved    || 0), 0);
    const totB  = projs.reduce((s, p) => s + (p.budgeted || 0), 0);

    document.getElementById('house-metrics').innerHTML = `
      <div class="metric"><div class="lbl">Total Quoted</div><div class="val">${fmt(totQ)}</div></div>

      <div class="metric"><div class="lbl">Total Saved</div><div class="val pos">${fmt(totS)}</div></div>
      <div class="metric"><div class="lbl">Still Needed</div><div class="val warn">${fmt(Math.max(0, totQ - totS))}</div></div>
    `;

    document.getElementById('house-body').innerHTML = projs.map((p, i) => {
      const r   = p.quote > 0 ? Math.min(p.saved / p.quote, 1) : 0;

        <td title="${escHtml(p.name)}">${escHtml(p.name)}</td>

const TxnsTab = (() => {
  function catOpts(sel) {
    return CATS.map(c=>`<option value="${escHtml(c)}"${c===sel?' selected':''}>${escHtml(c)}</option>`).join('');
  }
  function yearOpts() {
    const y=new Date().getFullYear();
    return Array.from({length:12},(_,i)=>y-2+i)
      .map(yr=>`<option value="${yr}"${yr===y?' selected':''}>${yr}</option>`).join('');
  }

  function render() {
    const year  = parseInt(document.getElementById('txn-year')?.value)  || new Date().getFullYear();
    const month = document.getElementById('txn-month')?.value || 'all';
    const search= (document.getElementById('txn-search')?.value||'').toLowerCase();
    const type  = document.getElementById('txn-type')?.value || 'all';

    let rows = [];
    const months = month === 'all' ? MONTHS : [month];
    months.forEach(m => {
      ((window.TXNS[year]||{})[m]||[]).forEach((t,i) => {
        rows.push({ t, m, i, year });
      });
    });

    if (type !== 'all') rows = rows.filter(r => r.t.type === type);
    if (search) rows = rows.filter(r =>
      (r.t.desc||'').toLowerCase().includes(search) ||
      (r.t.cat||'').toLowerCase().includes(search)
    );
    rows.sort((a,b) => b.t.date.localeCompare(a.t.date));

    const totalInc = rows.filter(r=>r.t.type==='income').reduce((s,r)=>s+r.t.amount,0);
    const totalExp = rows.filter(r=>r.t.type!=='income').reduce((s,r)=>s+r.t.amount,0);

    document.getElementById('txn-metrics').innerHTML = `
      <div class="metric"><div class="lbl">Showing</div><div class="val">${rows.length}</div></div>
      <div class="metric"><div class="lbl">Income</div><div class="val pos">${fmt(totalInc)}</div></div>
      <div class="metric"><div class="lbl">Expenses</div><div class="val neg">${fmt(totalExp)}</div></div>
      <div class="metric"><div class="lbl">Net</div>
        <div class="val ${totalInc-totalExp>=0?'pos':'neg'}">${fmt(totalInc-totalExp)}</div></div>
    `;

    const tableRows = rows.map(({t,m,i,year}) => `
      <tr>
        <td style="white-space:nowrap;color:var(--muted)">${t.date}</td>
        <td><span class="tag" style="font-size:10px">${m}</span></td>
        <td title="${escHtml(t.desc)}">${escHtml(t.desc.slice(0,30))}</td>
        <td>
          <select style="width:100%;font-size:10px;padding:1px 3px"
                  onchange="TxnsTab._remap(${year},'${m}',${i},this.value)">
            ${catOpts(t.cat)}
          </select>
        </td>
        <td style="text-align:right;color:${t.type==='income'?'var(--green)':'var(--red)'};font-weight:500">
          ${t.type==='income'?'+':'-'}${fmt(t.amount)}
        </td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="TxnsTab._remove(${year},'${m}',${i})"
                  style="font-size:10px;padding:1px 5px" title="Delete">✕</button>
        </td>
      </tr>`).join('');

    document.getElementById('txn-table-body').innerHTML = tableRows ||
      '<tr><td colspan="6" style="padding:16px;color:var(--muted);text-align:center">No transactions found.</td></tr>';
  }

  function _remap(year, month, idx, newCat) {
    const t = window.TXNS[year]?.[month]?.[idx];
    if (!t) return;
    t.cat = newCat;
    learnFromCorrection(t.desc, newCat);
    Storage.saveTxns();
    Storage.saveRules();
    _refreshAndRender(year, month);
    toast(`Remapped to "${newCat}".`, 'ok');
  }

  function _remove(year, month, idx) {
    if (!window.TXNS[year]?.[month]) return;
    const t = window.TXNS[year][month][idx];
    if (!confirm(`Delete: ${t.desc} (${fmt(t.amount)}) on ${t.date}?`)) return;
    window.TXNS[year][month].splice(idx, 1);
    Storage.saveTxns();
    _refreshAndRender(year, month);
    toast('Transaction removed.', 'ok');
  }

  function _clearMonth() {
    const year  = parseInt(document.getElementById('txn-year').value);
    const month = document.getElementById('txn-month').value;
    if (month === 'all') { toast('Select a specific month to clear.', 'warn'); return; }
    const count = (window.TXNS[year]?.[month]||[]).length;
    if (!count) { toast('No transactions in this month.', 'info'); return; }
    if (!confirm(`Clear ALL ${count} transactions for ${month} ${year}?\n\nYou can reimport after clearing.`)) return;
    window.TXNS[year][month] = [];
    _refreshAndRender(year, month);
    Storage.saveTxns();
    toast(`${month} ${year} cleared — ready to reimport.`, 'ok');
  }

  function _refreshAndRender(year, month) {
    // Recompute budget actuals for affected month
    if (typeof Import !== 'undefined' && Import._refreshActuals) {
      Import._refreshActuals(year, month);
      Storage.saveBudget();
    }
    if (window._mounted?.budget) Budget.render();
    if (window._mounted?.dashboard) Dashboard.render();
    render();
  }

  function mount() {
    const el = document.getElementById('tab-txns');
    el.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-end">
        <div><label>Year</label><select id="txn-year" onchange="TxnsTab.render()" style="width:auto">${yearOpts()}</select></div>
        <div><label>Month</label>
          <select id="txn-month" onchange="TxnsTab.render()" style="width:auto">
            <option value="all">All months</option>
            ${MONTHS.map(m=>`<option>${m}</option>`).join('')}
          </select>
        </div>
        <div><label>Type</label>
          <select id="txn-type" onchange="TxnsTab.render()" style="width:auto">
            <option value="all">All</option>
            <option value="expense">Expenses</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div style="flex:1;min-width:160px"><label>Search description / category</label>
          <input type="text" id="txn-search" placeholder="publix, mortgage…" oninput="TxnsTab.render()">
        </div>
        <button class="btn btn-danger" onclick="TxnsTab._clearMonth()"
                style="align-self:flex-end">Clear month &amp; reimport</button>
      </div>

      <div class="metrics" id="txn-metrics"></div>

      <div class="card" style="padding:0">
        <div class="tbl-wrap" style="max-height:480px">
          <table class="tbl" style="table-layout:fixed">
            <colgroup>
              <col style="width:11%"><col style="width:7%"><col style="width:26%">
              <col style="width:30%"><col style="width:13%"><col style="width:6%">
            </colgroup>
            <thead><tr>
              <th>Date</th><th>Month</th><th>Description</th>
              <th>Category (change to remap)</th><th style="text-align:right">Amount</th><th></th>
            </tr></thead>
            <tbody id="txn-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="alert alert-info" style="margin-top:8px;font-size:12px">
        <strong>Remapping:</strong> Change a category dropdown to reassign that transaction.
        It updates the budget immediately and teaches the auto-categorizer for future imports.<br>
        <strong>Clear &amp; reimport:</strong> Select a month, click "Clear month & reimport" to wipe all
        transactions for that month, then go to Import to upload fresh data.
      </div>
    `;
    render();
  }

  return { mount, render, _remap, _remove, _clearMonth };
})();

// ─── Auto-Cat Rules Tab ───────────────────────────────────────────────────────
const RulesTab = (() => {
  // ── inline edit state ────────────────────────────────────────────────────────
  let _editingIdx = null;  // null = adding new, number = editing existing rule

  function catOptions(selected) {
    return CATS.map(c => `<option value="${c}"${c===selected?' selected':''}>${c}</option>`).join('');
  }
  function srcTag(src) {
    const map = { 'built-in':'tag-builtin', learned:'tag-learned', custom:'tag-custom' };
    return `<span class="tag ${map[src]||''}">${src}</span>`;
  }

  // ── render rules table ────────────────────────────────────────────────────────
  function render() {
    const filter = (document.getElementById('rf')?.value || '').toLowerCase();
    const srcF   = document.getElementById('rs')?.value || 'all';
    const rows   = RULES.filter(r =>
      (!filter || r.kw.includes(filter) || r.cat.toLowerCase().includes(filter)) &&
      (srcF === 'all' || r.src === srcF)
    ).slice(0, 150);

    document.getElementById('rules-body').innerHTML = rows.map(r => {
      const realIdx = RULES.indexOf(r);
      const isEditing = realIdx === _editingIdx;
      return isEditing
        ? `<tr style="background:rgba(79,142,247,0.08)">
            <td><input type="text" id="edit-kw" value="${escHtml(r.kw)}"
                       style="width:100%;font-size:11px;padding:3px 6px"></td>
            <td><select id="edit-cat" style="width:100%;font-size:11px;padding:3px 4px">
                  ${catOptions(r.cat)}</select></td>
            <td>${srcTag(r.src)}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm btn-primary" onclick="RulesTab._saveEdit(${realIdx})"
                      style="font-size:10px;padding:2px 8px">Save</button>
              <button class="btn btn-sm" onclick="RulesTab._cancelEdit()"
                      style="font-size:10px;padding:2px 6px;margin-left:3px">Cancel</button>
            </td>
           </tr>`
        : `<tr>
            <td><code>${escHtml(r.kw)}</code></td>
            <td style="font-size:12px">${escHtml(r.cat)}</td>
            <td>${srcTag(r.src)}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm" onclick="RulesTab._startEdit(${realIdx})"
                      style="font-size:10px;padding:2px 7px">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="RulesTab._delete(${realIdx})"
                      style="font-size:10px;padding:2px 6px;margin-left:3px">✕</button>
            </td>
           </tr>`;
    }).join('') || '<tr><td colspan="4" style="padding:12px;color:var(--muted)">No matching rules.</td></tr>';

    // Render category manager too
    renderCats();
  }

  function _startEdit(idx) { _editingIdx = idx; render(); document.getElementById('edit-kw')?.focus(); }
  function _cancelEdit()   { _editingIdx = null; render(); }

  function _saveEdit(idx) {
    const kw  = document.getElementById('edit-kw')?.value.trim().toLowerCase();
    const cat = document.getElementById('edit-cat')?.value;
    if (!kw) { toast('Keyword cannot be empty.', 'err'); return; }
    if (!CATS.includes(cat)) { toast('Category not found.', 'err'); return; }
    RULES[idx] = { kw, cat, src: RULES[idx].src === 'built-in' ? 'custom' : RULES[idx].src };
    _editingIdx = null;
    Storage.saveRules();
    render();
    toast('Rule updated.', 'ok');
  }

  function _delete(idx) {
    const r = RULES[idx];
    if (!r || !confirm(`Delete rule: "${r.kw}" → ${r.cat}?`)) return;
    if (_editingIdx === idx) _editingIdx = null;
    RULES.splice(idx, 1);
    Storage.saveRules();
    render();
    toast('Rule deleted.', 'ok');
  }

  function _add() {
    const kw  = document.getElementById('rk').value.trim().toLowerCase();
    const cat = document.getElementById('rc').value;
    if (!kw) { showMsg('r-msg', 'Enter a keyword.', 'err'); return; }
    const existing = RULES.find(r => r.kw === kw);
    if (existing) {
      if (!confirm(`"${kw}" already maps to "${existing.cat}". Replace it?`)) return;
      existing.cat = cat; existing.src = 'custom';
    } else {
      RULES.unshift({ kw, cat, src: 'custom' });
    }
    Storage.saveRules();
    render();
    showMsg('r-msg', 'Rule saved.', 'ok');
    document.getElementById('rk').value = '';
  }

  // ── Category manager ──────────────────────────────────────────────────────────
  function renderCats() {
    const el = document.getElementById('cat-list');
    if (!el) return;
    el.innerHTML = CATS.map((c, i) => `
      <div class="row" style="padding:5px 0;align-items:center">
        <span style="flex:1;font-size:13px">${escHtml(c)}</span>
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm" onclick="RulesTab._renamecat(${i})"
                  style="font-size:10px;padding:2px 7px">Rename</button>
          <button class="btn btn-sm btn-danger" onclick="RulesTab._deletecat(${i})"
                  style="font-size:10px;padding:2px 6px">✕</button>
        </div>
      </div>`).join('');
  }

  function _addcat() {
    const name = document.getElementById('new-cat-name').value.trim();
    if (!name) { showMsg('cat-msg', 'Enter a category name.', 'err'); return; }
    if (CATS.includes(name)) { showMsg('cat-msg', 'Category already exists.', 'warn'); return; }
    CATS.push(name);
    Storage.saveCats();
    _refreshAllCatDropdowns();
    renderCats();
    showMsg('cat-msg', `"${name}" added.`, 'ok');
    document.getElementById('new-cat-name').value = '';
  }

  function _renamecat(idx) {
    const oldName = CATS[idx];
    const newName = window.prompt('Rename category:', oldName);
    if (!newName || newName.trim() === oldName) return;
    const trimmed = newName.trim();
    if (CATS.includes(trimmed)) { toast('That name already exists.', 'err'); return; }
    CATS[idx] = trimmed;
    // Update all rules that reference the old name
    RULES.forEach(r => { if (r.cat === oldName) r.cat = trimmed; });
    Storage.saveCats();
    Storage.saveRules();
    _refreshAllCatDropdowns();
    render();
    toast(`Renamed "${oldName}" → "${trimmed}". Rules updated.`, 'ok');
  }

  function _deletecat(idx) {
    const name = CATS[idx];
    const inUse = RULES.filter(r => r.cat === name).length;
    const msg = inUse
      ? `"${name}" is used by ${inUse} rule${inUse>1?'s':''}. Those rules will be set to "Miscellaneous". Delete anyway?`
      : `Delete category "${name}"?`;
    if (!confirm(msg)) return;
    CATS.splice(idx, 1);
    RULES.forEach(r => { if (r.cat === name) r.cat = 'Miscellaneous'; });
    Storage.saveCats();
    Storage.saveRules();
    _refreshAllCatDropdowns();
    render();
    toast(`"${name}" deleted.`, 'ok');
  }

  // Refresh every category <select> in the DOM after any cat change
  function _refreshAllCatDropdowns() {
    const opts = catOptions('');
    document.querySelectorAll('select[data-catselect]').forEach(sel => {
      const cur = sel.value;
      sel.innerHTML = opts;
      if (CATS.includes(cur)) sel.value = cur;
    });
    // Also rebuild the rule add form dropdowns
    const rc = document.getElementById('rc');
    if (rc) { const v = rc.value; rc.innerHTML = catOptions(CATS[0]); if (CATS.includes(v)) rc.value = v; }
    const sc = document.getElementById('s-cat');
    if (sc) { const v = sc.value; sc.innerHTML = catOptions(CATS[0]); if (CATS.includes(v)) sc.value = v; }
  }

function fmt(n) {
  if (n == null || isNaN(n)) return '$0';
  return (n < 0 ? '-$' : '$') +
    Math.abs(n).toLocaleString('en-US', { minimumFractionDigits:0, maximumFractionDigits:2 });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showMsg(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => { if (el) el.innerHTML = ''; }, 4000);
}

let _toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show alert-${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

function go(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('on'));
  document.getElementById('tab-' + name).classList.add('on');
  const btn = document.querySelector(`#nav button[data-tab="${name}"]`);
  if (btn) btn.classList.add('on');
  const mod = TABS[name];
  if (!mod) return;
  if (!_mounted[name]) {
    mod.mount();
    _mounted[name] = true;
  } else if (mod.render) {
    mod.render();
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// ─── Supabase Sync ────────────────────────────────────────────────────────────
// Real-time cross-device sync. Configure once in the Settings tab.
// All data is stored in YOUR Supabase project under your credentials.
const Sync = (() => {
  let _client  = null;
  let _userId  = 'kline-crew';  // shared key — all family devices share same data
  let _syncing = false;
  let _channel = null;

  function cfg() {
    return {
      url: localStorage.getItem('knb_sb_url')  || '',
      key: localStorage.getItem('knb_sb_key')  || '',
    };
  }

  function isConfigured() { const c = cfg(); return !!(c.url && c.key); }

  function init() {
    _updateSyncStatus();  // always show current status on load
    if (!isConfigured()) return;
    const { url, key } = cfg();
    try {
      _client = supabase.createClient(url, key);
      _subscribeToChanges();
      pull()
        .then(() => { toast('Synced with cloud.', 'ok'); _updateSyncStatus(); })
        .catch(e  => { console.warn('Supabase pull failed:', e); _updateSyncStatus(); });
    } catch(e) { console.warn('Supabase init failed:', e); }
  }

  // Push all app state to Supabase
  async function push() {
    if (!_client || _syncing) return;
    _syncing = true;
    try {
      const payload = {
        user_id:     _userId,
        updated_at:  new Date().toISOString(),
        txns:        JSON.stringify(window.TXNS   || {}),
        budget:      JSON.stringify(window.BUD    || {}),
        skeleton:    JSON.stringify(window.SKI    || {}),
        dtd:         JSON.stringify(window.DTDI   || {}),
        cali:        JSON.stringify(window.CALI   || {}),
        incsrc:      JSON.stringify(window.INCSRC || {}),
        goals:       JSON.stringify(window.GOALS  || []),
        debts:       JSON.stringify(window.DEBTS  || []),
        investments: JSON.stringify(window.INVS   || []),
        projects:    JSON.stringify(window.PROJS  || []),
        cats:        JSON.stringify(CATS),
        rules:       JSON.stringify(RULES.filter(r => r.src !== 'built-in')),
      };
      const { error } = await _client
        .from('budget_data')
        .upsert(payload, { onConflict: 'user_id' });
      if (error) throw error;
      localStorage.setItem('knb_last_sync', new Date().toISOString());
      _updateSyncStatus();
    } catch(e) {
      console.warn('Sync push failed:', e);
      toast('Sync failed — data saved locally.', 'warn');
    } finally { _syncing = false; }
  }

  // Pull latest data from Supabase and merge into app
  async function pull() {
    if (!_client) return;
    try {
      const { data, error } = await _client
        .from('budget_data')
        .select('*')
        .eq('user_id', _userId)
        .single();
      if (error || !data) return;
      _applyRemote(data);
    } catch(e) { console.warn('Sync pull failed:', e); }
  }

  function _applyRemote(data) {
    try {
      if (data.txns)        window.TXNS   = JSON.parse(data.txns);
      if (data.budget)      window.BUD    = JSON.parse(data.budget);
      if (data.skeleton)    window.SKI    = JSON.parse(data.skeleton);
      if (data.dtd)         window.DTDI   = JSON.parse(data.dtd);
      if (data.cali)        window.CALI   = JSON.parse(data.cali);
      if (data.incsrc)      window.INCSRC = JSON.parse(data.incsrc);
      if (data.goals)       window.GOALS  = JSON.parse(data.goals);
      if (data.debts)       window.DEBTS  = JSON.parse(data.debts);
      if (data.investments) window.INVS   = JSON.parse(data.investments);
      if (data.projects)    window.PROJS  = JSON.parse(data.projects);
      if (data.cats)        { const c = JSON.parse(data.cats); c.forEach(cat => { if (!CATS.includes(cat)) CATS.push(cat); }); }
      if (data.rules) {
        const saved = JSON.parse(data.rules);
        const builtIn = RULES.filter(r => r.src === 'built-in');
        RULES.length = 0; RULES.push(...saved, ...builtIn);
      }
      // Re-render all mounted tabs
      Object.keys(_mounted || {}).forEach(name => {
        const mod = ({dashboard:Dashboard,budget:Budget,goals:Goals,debt:Debt,invest:Invest,house:House})[name];
        if (mod?.render) mod.render();
      });
      _updateSyncStatus();
    } catch(e) { console.warn('Apply remote failed:', e); }
  }

  // Subscribe to real-time changes — any device push triggers pull on all others
  function _subscribeToChanges() {
    if (!_client) return;
    if (_channel) _channel.unsubscribe();
    _channel = _client
      .channel('budget_changes')
      .on('postgres_changes', {
        event:  '*',
        schema: 'public',
        table:  'budget_data',
        filter: `user_id=eq.${_userId}`,
      }, payload => {
        // Another device updated — apply changes
        if (payload.new) _applyRemote(payload.new);
        toast('Updated from another device.', 'info');
      })
      .subscribe();
  }

  function _updateSyncStatus() {
    const el = document.getElementById('sync-status');
    if (!el) return;
    const ts = localStorage.getItem('knb_last_sync');
    el.innerHTML = isConfigured()
      ? `<span style="color:var(--green)">● Connected</span>${ts ? ` <span class="muted" style="font-size:10px">Last sync: ${new Date(ts).toLocaleTimeString()}</span>` : ''}`
      : `<span style="color:var(--muted)">○ Not configured</span>`;
  }

  function configure(url, key) {
    localStorage.setItem('knb_sb_url', url);
    localStorage.setItem('knb_sb_key', key);
    _client = null; _channel = null;
    init();
  }

  return { init, push, pull, configure, isConfigured, cfg, _updateSyncStatus };
})();

// ─── PWA Service Worker (inline, enables Add to Home Screen) ──────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'kline-crew-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html'])));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
      ));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./')))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
